services:
  - type: web
    name: construction-management-web
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn constructionmanagement.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: construction-management-db
          property: connectionString

databases:
  - name: construction-management-db
    databaseName: construction_management
    user: construction_management
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
